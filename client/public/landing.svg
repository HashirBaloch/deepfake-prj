<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
    <defs>
        <style>
            /* Cyberpunk color palette */
            :root {
                --neon-pink: #ff2a6d;
                --neon-blue: #05d9e8;
                --neon-purple: #d300c5;
                --matrix-green: #00ff41;
                --dark-bg: #0d0221;
            }
            
            /* Glow effects */
            .glow-blue {
                filter: drop-shadow(0 0 5px var(--neon-blue));
            }
            .glow-pink {
                filter: drop-shadow(0 0 5px var(--neon-pink));
            }
            
            /* Animations */
            @keyframes scan {
                0% { transform: translateY(-50px); opacity: 0; }
                10%, 90% { opacity: 1; }
                100% { transform: translateY(650px); opacity: 0; }
            }
            @keyframes pulse {
                0%, 100% { opacity: 0.7; }
                50% { opacity: 1; }
            }
            @keyframes flicker {
                0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                    opacity: 1;
                }
                20%, 22%, 24%, 55% {
                    opacity: 0.3;
                }
            }
            @keyframes colorShift {
                0% { fill: var(--neon-blue); }
                33% { fill: var(--neon-pink); }
                66% { fill: var(--matrix-green); }
                100% { fill: var(--neon-blue); }
            }
            
            /* Main elements */
            .bg {
                fill: var(--dark-bg);
            }
            .grid-line {
                stroke: rgba(5, 217, 232, 0.1);
                stroke-width: 0.5;
            }
            .face-outline {
                stroke: var(--neon-blue);
                stroke-width: 3;
                fill: none;
            }
            .scan-line {
                stroke: var(--matrix-green);
                stroke-width: 2;
                animation: scan 3s linear infinite;
            }
            .neon-text {
                font-family: 'Courier New', monospace;
                font-weight: bold;
                text-anchor: middle;
            }
            .binary-code {
                font-family: 'Courier New', monospace;
                font-size: 10px;
                fill: var(--matrix-green);
                opacity: 0.7;
            }
        </style>
        
        <!-- Binary code pattern -->
        <pattern id="binaryPattern" patternUnits="userSpaceOnUse" width="20" height="20">
            <text x="0" y="10" class="binary-code">1010</text>
            <text x="0" y="20" class="binary-code">0101</text>
        </pattern>
    </defs>
    
    <!-- Dark background with grid -->
    <rect class="bg" width="600" height="600"/>
    
    <!-- Grid lines -->
    <g>
        <line class="grid-line" x1="0" y1="0" x2="600" y2="0"/>
        <line class="grid-line" x1="0" y1="100" x2="600" y2="100"/>
        <line class="grid-line" x1="0" y1="200" x2="600" y2="200"/>
        <line class="grid-line" x1="0" y1="300" x2="600" y2="300"/>
        <line class="grid-line" x1="0" y1="400" x2="600" y2="400"/>
        <line class="grid-line" x1="0" y1="500" x2="600" y2="500"/>
        <line class="grid-line" x1="0" y1="600" x2="600" y2="600"/>
    </g>
    
    <!-- Binary code background -->
    <rect width="600" height="600" fill="url(#binaryPattern)" opacity="0.1"/>
    
    <!-- Scanning animation -->
    <line class="scan-line" x1="0" y1="0" x2="600" y2="0"/>
    
    <!-- Main face analysis graphic -->
    <g transform="translate(300, 300)">
        <!-- Face outline -->
        <path class="face-outline" d="M-100,-50 C-120,0 -120,50 -100,100 C-50,120 0,120 50,100 C70,50 70,0 50,-50 C0,-70 -50,-70 -100,-50 Z"/>
        
        <!-- Left eye (scanning) -->
        <g transform="translate(-50, -20)">
            <circle cx="0" cy="0" r="20" fill="var(--dark-bg)" stroke="var(--neon-blue)" stroke-width="2"/>
            <circle cx="0" cy="0" r="15" fill="var(--neon-blue)" opacity="0.7" style="animation: pulse 2s infinite"/>
            <circle cx="0" cy="0" r="8" fill="var(--dark-bg)"/>
            <circle cx="0" cy="0" r="5" fill="var(--matrix-green)" style="animation: flicker 5s infinite"/>
        </g>
        
        <!-- Right eye (scanning) -->
        <g transform="translate(50, -20)">
            <circle cx="0" cy="0" r="20" fill="var(--dark-bg)" stroke="var(--neon-blue)" stroke-width="2"/>
            <circle cx="0" cy="0" r="15" fill="var(--neon-blue)" opacity="0.7" style="animation: pulse 2s infinite 0.5s"/>
            <circle cx="0" cy="0" r="8" fill="var(--dark-bg)"/>
            <circle cx="0" cy="0" r="5" fill="var(--matrix-green)" style="animation: flicker 7s infinite"/>
        </g>
        
        <!-- Mouth (pulse animation) -->
        <path d="M-40,40 Q0,60 40,40" stroke="var(--neon-pink)" stroke-width="3" fill="none" style="animation: pulse 1.5s infinite"/>
    </g>
    
    <!-- Detection status -->
    <g transform="translate(300, 100)">
        <rect x="-150" y="-30" width="300" height="60" rx="10" fill="var(--dark-bg)" stroke="var(--neon-blue)" stroke-width="2"/>
        <text class="neon-text" fill="var(--matrix-green)" font-size="24" style="animation: flicker 3s infinite">DEEPFAKE DETECTION</text>
    </g>
    
    <!-- Confidence meter -->
    <g transform="translate(300, 500)">
        <rect x="-150" y="-15" width="300" height="30" rx="5" fill="var(--dark-bg)" stroke="var(--neon-blue)" stroke-width="2"/>
        <rect x="-145" y="-10" width="290" height="20" rx="3" fill="none" stroke="var(--neon-pink)" stroke-width="1"/>
        <rect id="confidenceMeter" x="-145" y="-10" width="200" height="20" rx="3" fill="var(--neon-purple)" style="animation: pulse 1s infinite"/>
        <text class="neon-text" fill="var(--neon-blue)" font-size="14" y="7">87.3% CONFIDENCE</text>
    </g>
    
    <!-- Warning triangles -->
    <g class="glow-pink" style="animation: colorShift 4s infinite">
        <path transform="translate(100, 200)" d="M0,-20 L17.32,10 -17.32,10 Z"/>
        <path transform="translate(500, 200)" d="M0,-20 L17.32,10 -17.32,10 Z"/>
        <path transform="translate(100, 400)" d="M0,-20 L17.32,10 -17.32,10 Z"/>
        <path transform="translate(500, 400)" d="M0,-20 L17.32,10 -17.32,10 Z"/>
    </g>
    
    <!-- Animated script for dynamic elements -->
    <script type="text/ecmascript">
        <![CDATA[
        // Randomize confidence meter
        function updateMeter() {
            const meter = document.getElementById('confidenceMeter');
            const randomWidth = 100 + Math.random() * 190;
            const randomConfidence = Math.floor(70 + Math.random() * 30);
            
            meter.setAttribute('width', randomWidth);
            meter.nextElementSibling.textContent = randomConfidence + '.' + Math.floor(Math.random() * 10) + '% CONFIDENCE';
            
            setTimeout(updateMeter, 2000);
        }
        
        // Start animations
        updateMeter();
        ]]>
    </script>
</svg>